<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nekurabe Support</title>
  <meta name="description" content="Support, privacy policy, terms, and app-ads.txt information for Nekurabe.">
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    body {
      margin: 0;
      color: #1f2933;
      background: #f8fafc;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 64px 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.1;
    }

    p {
      margin: 0 0 24px;
      color: #52606d;
      font-size: 1.05rem;
    }

    nav {
      display: grid;
      gap: 12px;
      margin-top: 32px;
    }

    a {
      color: #0967d2;
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.16em;
    }

    nav a {
      display: block;
      padding: 14px 16px;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      background: #ffffff;
      font-weight: 600;
      text-decoration: none;
    }

    @media (prefers-color-scheme: dark) {
      body {
        color: #f5f7fa;
        background: #111827;
      }

      p {
        color: #cbd2d9;
      }

      a {
        color: #7cc4fa;
      }

      nav a {
        border-color: #323f4b;
        background: #1f2933;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Nekurabe Support</h1>
    <p>Support resources and legal information for the Nekurabe app.</p>

    <nav aria-label="Support links">
      <a href="privacy-policy.md">Privacy Policy</a>
      <a href="terms-and-conditions.md">Terms &amp; Conditions</a>
      <a href="app-ads.txt">app-ads.txt</a>
    </nav>
  </main>
</body>
</html>
